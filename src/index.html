<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081019">
  <title>Near-real-time wildfire earth view</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./client.css">
</head>
<body>
  <main id="map" aria-label="Wildfire progression map"></main>

  <button id="menu-button" class="menu-toggle" type="button" aria-label="Toggle mission details"
          aria-expanded="false" aria-controls="specifications-panel" data-state="loading">⋮</button>
  <button id="terrain-button" class="menu-toggle terrain-toggle" type="button"
          aria-label="Toggle 3D terrain view" aria-pressed="false">3D</button>

  <section id="specifications-panel" class="specifications" aria-labelledby="spec-title" hidden>
    <div class="specifications__heading">
      <div>
        <p class="eyebrow" id="spec-tagline">Near-real-time earth view</p>
        <h1 id="spec-title">Wildfire</h1>
      </div>
      <span id="connection-status" class="status" data-state="loading">Connecting</span>
    </div>

    <dl class="spec-grid">
      <div><dt>Observed</dt><dd id="spec-observed">—</dd></div>
      <div><dt>Freshness</dt><dd id="spec-freshness">—</dd></div>
      <div><dt>Layers</dt><dd id="spec-layers">Global satellite base</dd></div>
      <div><dt>Pipeline</dt><dd id="spec-pipeline">Loading catalog</dd></div>
      <div class="spec-grid__wide"><dt>Data cadence</dt><dd id="spec-source">FIRMS 3h · Sentinel acquisition-driven</dd></div>
    </dl>

    <p id="error-message" class="error" role="alert" hidden></p>
  </section>

  <section class="timeline" aria-label="Fire progression timeline">
    <button id="play-button" class="timeline__button" type="button" aria-label="Play timeline">Play</button>
    <div class="timeline__track">
      <output id="timeline-label" for="timeline-range">Loading snapshots…</output>
      <input id="timeline-range" type="range" min="0" max="0" step="1" value="0" disabled aria-label="Select snapshot">
    </div>
    <select id="playback-speed" class="timeline__speed" aria-label="Playback speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="live-button" class="timeline__live" type="button" data-active="true" aria-pressed="true">Live</button>
  </section>

  <!--FIRE_BOOTSTRAP-->
  <script type="module" src="./client.js"></script>
</body>
</html>
