name: Validate and deploy Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EM_VERSION: 6.0.3
  CLOUDFLARE_PAGES_PROJECT: wildfire-boundary-tracker

jobs:
  validate:
    name: Validate production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build WASM module
        run: npm run build:wasm

      - name: Build C++26 Worker engine
        run: npm run build:worker-wasm

      - name: Run tests
        run: npm test

      - name: Build production Pages bundle
        run: npm run build:pages

      - name: Upload validated Pages bundle
        uses: actions/upload-artifact@v7
        with:
          name: pages-dist-${{ github.sha }}
          path: |
            dist/
            functions/wasm/firms_engine.wasm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://wildfire-boundary-tracker.pages.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deployment tooling
        run: npm ci --ignore-scripts

      - name: Download validated Pages bundle
        uses: actions/download-artifact@v8
        with:
          name: pages-dist-${{ github.sha }}
          path: .

      - name: Report missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::warning::Deployment skipped: set the CLOUDFLARE_API_TOKEN repository secret.'
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::warning::Deployment skipped: set the CLOUDFLARE_ACCOUNT_ID repository variable.'
          fi

      - name: Deploy production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          npx wrangler pages deploy dist
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "GitHub Actions deployment"
          --commit-dirty=false
